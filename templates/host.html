<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
<title>Ведущий — {{ title }}</title>
<style>
:root{--bg:#0d0d0e;--card:#17171a;--line:#2a2a2e;--yellow:#ffd21c;--green:#52d273;--red:#ff6b6b;--muted:#9a9aa2}
body{background:var(--bg)}
.w{max-width:720px;padding:20px 16px 60px}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.eyebrow{color:var(--yellow);font-weight:900;font-size:13px;letter-spacing:.08em}
.quiz-title{font-size:26px;font-weight:900;line-height:1.15;margin:4px 0 0}
.qr-link{color:var(--muted);font-size:14px;text-decoration:none;white-space:nowrap;padding-top:2px}
.qr-link:hover{color:var(--yellow);text-decoration:underline}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.card h2{margin:0 0 14px;font-size:14px;letter-spacing:.08em;color:var(--muted);font-weight:800}

.round-nav{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}
.round-nav button{margin:0;height:48px;border-radius:12px;font-size:20px;background:#26262b;color:#fff}
.round-nav button:disabled{opacity:.35}
.round-nav select{height:48px;border-radius:12px;font-size:17px;font-weight:700;text-align:center;text-align-last:center;background:#0f0f11;border:1px solid var(--line);color:#fff;width:100%}
#q{font-size:clamp(22px,4vw,30px);line-height:1.2;margin:18px 0 0;font-weight:900}

.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.chip{background:#0f0f11;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--muted)}
.chip b{color:#fff;font-size:16px;margin-left:4px}

.main-btn{display:block;width:100%;margin:18px 0 0;padding:18px;border-radius:14px;font-size:18px;font-weight:900;letter-spacing:.03em}
.main-btn.open{background:var(--yellow);color:#111}
.main-btn.close{background:var(--red);color:#111}
.reset{display:block;margin:12px auto 0;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:6px 10px}
.reset:hover{color:var(--red)}

.answer{margin-top:14px}
.answer:first-of-type{margin-top:0}
.answer .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.answer .name{font-weight:700}
.answer .pct{color:var(--muted);font-weight:700;white-space:nowrap}
.answer.right .name,.answer.right .pct{color:var(--green)}
.bar-track{height:10px;background:#26262b;border-radius:99px;margin-top:7px;overflow:hidden}
.bar-fill{height:100%;background:var(--yellow);border-radius:99px;transition:width .4s}
.answer.right .bar-fill{background:var(--green)}

table{width:100%;border-collapse:collapse}
td{padding:11px 4px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td:last-child{text-align:right;font-weight:900}
.place{color:var(--muted);display:inline-block;width:28px}
tr:nth-child(1) .place{color:var(--yellow)}

.remote-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;margin-bottom:0}
.remote-head h2{margin:0}
.status{font-size:13px;font-weight:800;color:var(--muted)}
.remote-body{display:none;margin-top:16px}
.remote.open .remote-body{display:block}
.remote-row{display:flex;gap:8px;flex-wrap:wrap}
.remote-row input{flex:1;min-width:140px;padding:12px;background:#0f0f11;color:#fff;border:1px solid var(--line);border-radius:10px}
.remote-row button{margin:0;background:#26262b;color:#fff}
.remote-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.remote-nav button{margin:0;padding:18px 8px;border-radius:12px;font-weight:900;background:#26262b;color:#fff}
.remote-nav button:last-child{background:var(--yellow);color:#111}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="w">
  <div class="bar">
    <div>
      <div class="eyebrow">ПАНЕЛЬ ВЕДУЩЕГО</div>
      <div class="quiz-title">{{ title }}</div>
    </div>
    <a class="qr-link" href="/qr/{{ qid }}" target="_blank" rel="noopener">QR для участников ↗</a>
  </div>

  <div class="card">
    <h2 id="lbl">ВОПРОС</h2>
    <div class="round-nav">
      <button id="prev" onclick="step(-1)" aria-label="Предыдущий раунд">←</button>
      <select id="sel" onchange="rnd()"></select>
      <button id="next" onclick="step(1)" aria-label="Следующий раунд">→</button>
    </div>
    <div id="q"></div>
    <div class="stats">
      <span class="chip">Участников <b id="players">0</b></span>
      <span class="chip">Проголосовало <b id="voted">0</b></span>
    </div>
    <button id="tog" class="main-btn open" onclick="act('toggle')"></button>
    <button class="reset" onclick="reset()">Сбросить игру</button>
  </div>

  <div class="card"><h2>РЕЗУЛЬТАТЫ РАУНДА</h2><div id="res"></div></div>
  <div class="card"><h2>ТАБЛИЦА ЛИДЕРОВ</h2><div id="lead"></div></div>

  <div class="card remote" id="remote">
    <div class="remote-head" onclick="document.getElementById('remote').classList.toggle('open')">
      <h2>ПУЛЬТ СЛАЙДОВ</h2>
      <span id="pptStatus" class="status">логин не задан</span>
    </div>
    <div class="remote-body">
      <div class="remote-row">
        <input id="pptLogin" placeholder="Логин пульта">
        <button onclick="savePptLogin()">ПОДКЛЮЧИТЬ</button>
        <button onclick="resetPptLogin()">СБРОСИТЬ ЛОГИН</button>
      </div>
      <div class="remote-nav">
        <button onclick="ppt('prev')">← ПРЕДЫДУЩИЙ СЛАЙД</button>
        <button onclick="ppt('next')">СЛЕДУЮЩИЙ СЛАЙД →</button>
      </div>
    </div>
  </div>
</div>

<script>
const QID={{ qid|tojson }};
const KEY=new URLSearchParams(location.search).get("k")||"";
const LETTERS="АБВГДЕЖЗ";
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const base=`/api/q/${QID}/admin`;
let total=0,current=1;

async function act(a,e={}){
  await fetch(`${base}/action?k=${encodeURIComponent(KEY)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:a,...e})});
  load();
}
function rnd(){act("round",{round:+sel.value})}
function step(d){const n=current+d;if(n>=1&&n<=total)act("round",{round:n})}
function reset(){if(confirm("Удалить участников, голоса и очки?"))act("reset")}

async function load(){
  const resp=await fetch(`${base}?k=${encodeURIComponent(KEY)}`);
  if(!resp.ok)return;
  const d=await resp.json();
  const sig=d.items.map(i=>i.label).join("|");
  if(sel.dataset.sig!==sig){sel.innerHTML="";d.items.forEach(i=>sel.add(new Option(i.label,i.n)));sel.dataset.sig=sig}
  total=d.total;current=d.current;sel.value=d.current;
  prev.disabled=d.current<=1;next.disabled=d.current>=d.total;
  lbl.textContent=d.label;
  q.textContent=d.question;
  players.textContent=d.players;voted.textContent=d.voted;
  tog.textContent=d.open?"ЗАКРЫТЬ ГОЛОСОВАНИЕ":"ОТКРЫТЬ ГОЛОСОВАНИЕ";
  tog.className="main-btn "+(d.open?"close":"open");
  const t=Math.max(1,d.voted);
  res.innerHTML=d.answers.map((x,i)=>{
    const p=Math.round(d.counts[i]*100/t);
    return `<div class="answer ${i===d.correct?"right":""}">
      <div class="row"><span class="name">${LETTERS[i]}. ${esc(x)}${i===d.correct?" ✓":""}</span><span class="pct">${d.counts[i]} · ${p}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${d.counts[i]*100/t}%"></div></div></div>`}).join("");
  lead.innerHTML=d.leaders.length?"<table>"+d.leaders.map((x,i)=>`<tr><td><span class="place">${i+1}</span>${esc(x.name)}</td><td>${x.score}</td></tr>`).join("")+"</table>":"<span class=muted>Пока нет участников</span>";
}
setInterval(load,1000);load();

/* Пульт презентаций */
const pptLogin=document.getElementById("pptLogin"),pptStatus=document.getElementById("pptStatus");
pptLogin.value=localStorage.getItem("pptLogin")||"";
let activePptLogin=cleanLogin(pptLogin.value);
let pptRemoteId=localStorage.getItem("pptAdminRemoteId")||"";
if(!pptRemoteId){pptRemoteId="admin-"+(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random());localStorage.setItem("pptAdminRemoteId",pptRemoteId)}
function cleanLogin(v){return (v||"").trim().toLowerCase().replace(/[^a-zа-яё0-9_-]/gi,"").slice(0,40)}
function savePptLogin(){
  const login=cleanLogin(pptLogin.value);pptLogin.value=login;
  if(!login)return;
  activePptLogin=login;localStorage.setItem("pptLogin",login);
  pptHeartbeat();pptStatusUpdate();
}
function resetPptLogin(){
  activePptLogin="";localStorage.removeItem("pptLogin");pptLogin.value="";
  pptStatus.textContent="логин не задан";pptStatus.style.color="";
}
async function ppt(command){
  const login=activePptLogin;
  if(!login){alert("Введите логин пульта и нажмите ПОДКЛЮЧИТЬ");return}
  try{await fetch("/api/presentation/command",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,command})})}catch(e){}
}
async function pptHeartbeat(){
  const login=activePptLogin;if(!login)return;
  try{await fetch("/api/presentation/remote-heartbeat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login,remote_id:pptRemoteId})})}catch(e){}
}
async function pptStatusUpdate(){
  const login=activePptLogin;
  if(!login){pptStatus.textContent="логин не задан";return}
  try{
    const r=await fetch("/api/presentation/status?login="+encodeURIComponent(login),{cache:"no-store"});
    const d=await r.json();
    if(!r.ok)throw new Error();
    pptStatus.textContent=(d.online>0?"● подключен · ":"○ не подключен · ")+login;
    pptStatus.style.color=d.online>0?"var(--green)":"";
  }catch(e){pptStatus.textContent="связь с сервером…";pptStatus.style.color=""}
}
setInterval(pptHeartbeat,3000);setInterval(pptStatusUpdate,1500);pptHeartbeat();pptStatusUpdate();
</script>
</body>
</html>
